<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Callback TikTok</title>
<style>
  body{ font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; max-width:680px; margin:0 auto; padding:48px 20px; line-height:1.6; color:#242220; background:#faf9f7; }
  h1{ font-size:22px; }
  .box{ background:#fff; border:1px solid #e5e0d8; border-radius:8px; padding:20px; margin-top:20px; word-break:break-all; font-family:monospace; font-size:15px; }
  .label{ font-weight:bold; color:#6b6660; font-size:13px; text-transform:uppercase; margin-bottom:6px; }
  .empty{ color:#999; font-style:italic; }
</style>
</head>
<body>
<h1>Autorização recebida</h1>
<p>Copie o código abaixo e envie de volta na conversa.</p>

<div class="box">
  <div class="label">code</div>
  <div id="code" class="empty">(nenhum)</div>
</div>

<div class="box">
  <div class="label">state</div>
  <div id="state" class="empty">(nenhum)</div>
</div>

<div class="box">
  <div class="label">error</div>
  <div id="error" class="empty">(nenhum)</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const set = (id, key) => {
    const val = params.get(key);
    if (val) document.getElementById(id).textContent = val, document.getElementById(id).classList.remove('empty');
  };
  set('code', 'code');
  set('state', 'state');
  set('error', 'error_description') || set('error', 'error');
</script>
</body>
</html>
